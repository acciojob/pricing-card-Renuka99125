
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #f1f1f1;
            width: 400px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .box {
            display: flex;
            justify-content: center;
        }

        .box img {
            width: 320px;
            height: 200px;
        }

        h1 {
            margin: 10px 0 0;
            font-size: 50px;
        }

        p {
            margin: 5px 0;
            font-size: 28px;
            font-weight: normal;
        }

        .color {
            display: inline-block;
            background-color: #f26860;
            color: white;
            padding: 18px 25px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 28px;
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPr5oVGJQqtBq93LzJVzClLye-E4bzIAoQb5lX6Hy9pw&s=10" alt="Heart-shaped red tree">
        </div>

        <h1>Pricing Card</h1>
        <p>Price: Rs.200</p>
        <p>Description: Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        <h3 class="color">Buy Now</h3>
    </div>
</body>
</html>
